<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ form.name }}</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root { --orange: #FF6B35; --orange-dark: #E55A2B; --ink: #1C1814; --ink-2: #6B6259; --line: #E5DDD4; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; color: var(--ink);
           background: radial-gradient(900px 420px at 80% -10%, #FDEEE4 0%, #F7F4F1 55%) fixed;
           min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .wrap { width: 100%; max-width: 440px; }
    .card { background: #fff; border: 1px solid #EAE3DA; border-radius: 16px; padding: 28px;
            box-shadow: 0 1px 2px rgba(28,24,20,.05), 0 14px 40px rgba(28,24,20,.08); }
    h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.01em; }
    .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 14px 0 5px; }
    input, textarea { width: 100%; padding: 12px 13px; border: 1.5px solid var(--line); border-radius: 9px;
                      font-family: inherit; font-size: 15px; background: #fff; }
    input:focus, textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,107,53,.15); }
    textarea { min-height: 88px; resize: vertical; }
    button { width: 100%; margin-top: 20px; background: linear-gradient(120deg, var(--orange), var(--orange-dark));
             color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 15.5px; font-weight: 800;
             font-family: inherit; cursor: pointer; box-shadow: 0 6px 16px rgba(255,107,53,.35);
             transition: transform .15s ease, box-shadow .15s ease; }
    button:hover { transform: translateY(-1px); box-shadow: 0 9px 22px rgba(255,107,53,.4); }
    .powered { text-align: center; margin-top: 16px; font-size: 12px; color: var(--ink-2); }
    .powered a { color: var(--orange-dark); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>{{ form.name }}</h1>
      <p class="sub">Leave your info and we'll get right back to you.</p>
      <form method="post" action="/form/{{ form.slug }}">
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <label>Your name *</label>
        <input type="text" name="name" required autocomplete="name">
        <label>Cell number *</label>
        <input type="tel" name="phone" required autocomplete="tel">
        <label>Email</label>
        <input type="email" name="email" autocomplete="email">
        <label>Business name</label>
        <input type="text" name="business" autocomplete="organization">
        <label>Anything we should know?</label>
        <textarea name="message" placeholder="What do you need? Timeline? Links?"></textarea>
        <button type="submit">Send it</button>
      </form>
    </div>
    <p class="powered">Powered by <a href="https://60minutesites.com" target="_blank" rel="noopener">60 Minute Sites</a></p>
  </div>
</body>
</html>
