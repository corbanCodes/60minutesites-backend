<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanks!</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #F7F4F1; color: #1C1814; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border: 1px solid #E5DDD4; border-radius: 16px; padding: 48px 44px; text-align: center; max-width: 420px; margin: 20px; }
    .check { font-size: 44px; }
    h1 { font-size: 26px; margin: 10px 0 6px; }
    p { color: #6B6259; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>Got it — thanks!</h1>
    <p>Your message went through. We'll get back to you shortly.</p>
  </div>
</body>
</html>
