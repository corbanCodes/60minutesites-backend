<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | 60MS HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static-admin/admin.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card form" method="post">
    <div class="logo"><span>60</span>MinuteSites HQ</div>
    <p class="muted" style="margin-top:0">Create your account — build sites, collect leads.</p>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash" style="background:#F8E4E1;color:#B3362B">{{ m }}</div>{% endfor %}
    {% endwith %}
    <input type="text" name="_gotcha" style="display:none !important" tabindex="-1" autocomplete="off">
    <div><label for="name">Your name</label><input type="text" id="name" name="name" required autofocus></div>
    <div><label for="email">Email</label><input type="email" id="email" name="email" required></div>
    <div><label for="password">Password (6+ characters)</label><input type="password" id="password" name="password" minlength="6" required></div>
    <div><label for="access_code">Access code</label><input type="password" id="access_code" name="access_code" required autocomplete="off">
      <p class="muted" style="font-size:12px;margin:4px 0 0">Accounts are set up by 60 Minute Sites — don't have a code? Call <b>1-800-60-4-LIFE</b>.</p></div>
    <fieldset class="addons">
      <legend>Add-ons</legend>
      <label class="addon"><input type="checkbox" name="feature_multi_user" id="mu">
        <span><b>Multi-user support</b><em>Invite your team into the CRM with roles and seat limits.</em></span></label>
      <div class="addon-sub" id="seatrow" hidden>
        <label for="seat_limit">How many seats?</label>
        <input type="number" id="seat_limit" name="seat_limit" value="5" min="1" max="200">
      </div>
      <label class="addon"><input type="checkbox" name="feature_dialer">
        <span><b>AI calling system</b><em>Power dialer, AI voice agent, recordings and call scoring.</em></span></label>
    </fieldset>
    <script>
      (function () {
        var mu = document.getElementById('mu'), row = document.getElementById('seatrow');
        function sync() { row.hidden = !mu.checked; }
        mu.addEventListener('change', sync); sync();
      })();
    </script>
    <button class="btn" type="submit" style="width:100%">Create account</button>
    <p class="muted" style="text-align:center;margin:4px 0 0">
      Already in? <a href="/login" style="color:var(--orange);font-weight:700">Log in</a>
    </p>
  </form>
</div>
</body>
</html>
