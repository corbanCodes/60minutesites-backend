<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join {{ company }} | 60MS HQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static-admin/admin.css">
  <link rel="stylesheet" href="/static-admin/dialer.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card form" method="post">
    <div class="logo"><span>60</span>MinuteSites HQ</div>
    <p class="muted" style="margin-top:0">You've been given a seat on <b>{{ company }}</b>'s account as {{ inv.role }}. Pick a password and you're in.</p>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash" style="background:#F8E4E1;color:#B3362B">{{ m }}</div>{% endfor %}
    {% endwith %}
    <div><label for="email">Email</label><input type="email" id="email" value="{{ inv.email }}" disabled></div>
    <div><label for="name">Your name</label><input type="text" id="name" name="name" value="{{ inv.name }}" required autofocus></div>
    <div><label for="password">Choose a password (6+ characters)</label><input type="password" id="password" name="password" minlength="6" required></div>
    <button class="btn" type="submit" style="width:100%">Set up my login</button>
  </form>
</div>
</body>
</html>
